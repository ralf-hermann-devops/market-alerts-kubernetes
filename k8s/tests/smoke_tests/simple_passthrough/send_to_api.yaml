apiVersion: batch/v1
kind: Job
metadata:
  name: simple-passthrough
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: python-test
          image: python:3.14-alpine
          command: ["python", "-u", "/scripts/send_to_api.py"]
          env:
            - name: REQUEST_COUNT
              value: "5"
            - name: WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: trading-alerts-secrets
                  key: webhook-secret
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: simple-passthrough-script
