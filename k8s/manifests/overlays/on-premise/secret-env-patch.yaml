apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: trading-alerts
spec:
  template:
    spec:
      containers:
        - name: api
          env:
            - name: WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: trading-alerts-secrets
                  key: webhook-secret
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-alerts-secrets
                  key: redis-password
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: trading-alerts
spec:
  template:
    spec:
      containers:
        - name: worker
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-alerts-secrets
                  key: redis-password
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-alerts-secrets
                  key: postgres-password
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: trading-alerts
spec:
  template:
    spec:
      containers:
        - name: redis
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-alerts-secrets
                  key: redis-password
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: trading-alerts
spec:
  template:
    spec:
      containers:
        - name: postgres
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-alerts-secrets
                  key: postgres-password
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: market-data-fetcher
  namespace: trading-alerts
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: fetcher
              env:
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: trading-alerts-secrets
                      key: postgres-password
