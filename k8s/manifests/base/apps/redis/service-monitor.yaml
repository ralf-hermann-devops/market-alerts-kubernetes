apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: redis
  namespace: trading-alerts
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - trading-alerts
  selector:
    matchLabels:
      app: redis-metrics
  endpoints:
    - port: metrics
      path: /metrics
      interval: 10s
