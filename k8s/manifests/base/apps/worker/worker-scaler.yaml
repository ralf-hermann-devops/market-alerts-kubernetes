apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker-redis-streams
  namespace: trading-alerts
spec:
  scaleTargetRef:
    name: worker
  pollingInterval: 15
  cooldownPeriod: 60
  minReplicaCount: 1
  maxReplicaCount: 20
  triggers:
    - type: redis-streams
      metadata:
        # this address resolves in the keda operators namespace
        host: redis.trading-alerts.svc.cluster.local
        port: "6379"
        passwordFromEnv: REDIS_PASSWORD
        stream: alerts
        consumerGroup: workers
        lagCount: "50"
        activationLagCount: "1"
    - type: cpu   # less important, but we want to scale up if CPU is high to get ahead of Redis lag building up
      metricType: Utilization
      metadata:
        value: "80"