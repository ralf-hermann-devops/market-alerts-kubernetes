apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: trading-alerts
spec:
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: trading-worker:dev
          envFrom:
            - configMapRef:
                name: app-config
          # add a way to test for readiness and liveness probes
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
