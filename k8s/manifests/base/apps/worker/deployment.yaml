apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: trading-alerts
spec:
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: trading-worker:dev
          envFrom:
            - configMapRef:
                name: app-config
          env:
            # worker needs to know the redis and postgres passwords
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-alerts-secrets
                  key: redis-password
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-alerts-secrets
                  key: postgres-password
          # add a way to test for readiness and liveness probes
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
