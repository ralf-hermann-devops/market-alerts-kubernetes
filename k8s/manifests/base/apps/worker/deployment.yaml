apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: trading-alerts
spec:
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      serviceAccountName: worker
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      containers:
        - name: worker
          image: trading-worker:dev
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          env:
            - name: WORKER_CPU_LOAD_SECONDS
              value: "0"
          envFrom:
            - configMapRef:
                name: app-config
          env:
            # worker needs to know the redis and postgres passwords
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-alerts-secrets
                  key: redis-password
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-alerts-secrets
                  key: postgres-password
          # add a way to test for readiness and liveness probes
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
