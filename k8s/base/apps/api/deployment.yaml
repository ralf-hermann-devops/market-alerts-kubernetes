apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: trading-alerts
spec:
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: trading-api:dev
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: trading-alerts-secrets
                  key: webhook-secret
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-alerts-secrets
                  key: redis-password
