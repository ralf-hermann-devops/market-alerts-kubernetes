apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: trading-alerts
spec:
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: [sh, -c, exec redis-server --requirepass "$REDIS_PASSWORD"]
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-alerts-secrets
                  key: redis-password
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: [sh, -c, REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli ping | grep -q PONG]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: [sh, -c, REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli ping | grep -q PONG]
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
