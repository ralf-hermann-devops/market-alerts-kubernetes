x-redis-env: &redis-env
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  REDIS_PASSWORD: redis-dev-password  # throwaway password for temporary provisioning in local dev environment
  REDIS_STREAM: alerts

x-postgres-env: &postgres-env
  POSTGRES_USER: app
  POSTGRES_PASSWORD: password   # throwaway password for temporary provisioning in local dev environment
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: alerts

services:
  api:
    build: ./services/api
    image: trading-api:dev
    ports: ["8000:8000"]
    environment:
      <<: *redis-env
      WEBHOOK_SECRET: dev-secret
    depends_on: [redis]
  worker:
    build: ./services/worker
    image: trading-worker:dev
    environment:
      <<: [*redis-env, *postgres-env]
      REDIS_GROUP: workers
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
  fetcher:
    build: ./services/fetcher
    image: trading-fetcher:dev
    environment:
      <<: *postgres-env
      SYMBOLS: AAPL
    depends_on:
      postgres:
        condition: service_healthy
  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis-dev-password}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redis-dev-password}"]
  postgres:
    image: postgres:16-alpine
    environment: *postgres-env
    volumes: ["./services/db/init.sql:/docker-entrypoint-initdb.d/init.sql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
  smoke-client:
    image: busybox:1.36
    profiles: ["smoke"]
    entrypoint: ["sh", "-c"]