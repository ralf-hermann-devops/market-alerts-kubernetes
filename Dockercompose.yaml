x-redis-env: &redis-env
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  REDIS_PASSWORD: redis-dev-password
  REDIS_STREAM: alerts

x-postgres-env: &postgres-env
  POSTGRES_USER: app
  POSTGRES_PASSWORD: password
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: alerts

services:
  api:
    build: ./services/api
    ports: ["8000:8000"]
    environment:
      <<: *redis-env
      WEBHOOK_SECRET: dev-secret
    depends_on: [redis]
  worker:
    build: ./services/worker
    environment:
      <<: [*redis-env, *postgres-env]
      REDIS_GROUP: workers
    depends_on: [redis, postgres]
  fetcher:
    build: ./services/fetcher
    environment:
      <<: *postgres-env
      SYMBOLS: AAPL
    depends_on: [postgres]
  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis-dev-password}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redis-dev-password}"]
  postgres:
    image: postgres:16-alpine
    environment: *postgres-env
    volumes: ["./services/db/init.sql:/docker-entrypoint-initdb.d/init.sql"]
  smoke-client:
    image: busybox:1.36
    profiles: ["smoke"]
    entrypoint: ["sh", "-c"]