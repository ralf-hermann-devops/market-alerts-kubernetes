name: Application CI

on:
  push:
    # only run pipeline if changes are made to application code,
    # Kubernetes manifests, Docker Compose, or the pipeline itself
    paths:    
      - "services/**"
      - "k8s/**"
      - "Dockercompose.yaml"
      - ".github/workflows/application-ci.yml"
  pull_request:
    paths:
      - "services/**"
      - "k8s/**"
      - "Dockercompose.yaml"
      - ".github/workflows/application-ci.yml"

env:
  SERVICE_IMAGES_ARTIFACT: service-images

jobs:
  application-lint:
    name: Application lint check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"
      - name: Install Ruff
        run: python -m pip install ruff
      - name: Lint Python code
        run: ruff check --isolated services   # running recommended default checks

  application-dependency-audit:
    name: Application dependency audit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, worker, fetcher, redis]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"
      - name: Install audit tools and service dependencies
        run: python -m pip install pip-audit pipdeptree -r services/${{ matrix.service }}/requirements.txt
      - name: Show dependency tree
        run: pipdeptree --warn silence
      - name: Audit dependencies
        run: pip-audit -r services/${{ matrix.service }}/requirements.txt

  build-service-images:
    name: Build service images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build service images
        run: docker compose -f Dockercompose.yaml build --pull api worker fetcher redis-exporter
      - name: Save service images
        run: docker save -o "${{ env.SERVICE_IMAGES_ARTIFACT }}.tar" trading-api:dev trading-worker:dev trading-fetcher:dev trading-redis-exporter:dev
      - name: Upload service images
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SERVICE_IMAGES_ARTIFACT }}
          path: "${{ env.SERVICE_IMAGES_ARTIFACT }}.tar"
          compression-level: 0
          retention-days: 1

  image-scan:
    name: Image scan for vulnerabilities
    needs: build-service-images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, worker, fetcher, redis-exporter]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Load service images
        uses: ./.github/actions/load-service-images
        with:
          artifact: ${{ env.SERVICE_IMAGES_ARTIFACT }}
      - name: Scan ${{ matrix.service }} image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: trading-${{ matrix.service }}:dev
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          # file doesnt take in account the actually installed and updated pip dependencies of the image
          skip-files: /usr/local/lib/python3.14/site-packages/pip/_vendor/bom.cdx.json  

  application-tests:
    name: Application tests
    needs: build-service-images
    runs-on: ubuntu-latest
    env:
      # tells tests not to rebuild images, but use the ones built in the previous step
      COMPOSE_NO_REBUILD_IN_TESTS: "1"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"
      - name: Install API test dependencies
        run: python -m pip install -r services/api/requirements.txt
      - name: Run API unit tests
        run: python -m pytest services/api/tests/test_testclient_api.py
      - name: Run Redis exporter tests
        run: python -m pytest services/redis/tests/test_exporter.py
      - name: Load service images
        uses: ./.github/actions/load-service-images
        with:
          artifact: ${{ env.SERVICE_IMAGES_ARTIFACT }}
      - name: Test worker processing
        run: python services/worker/tests/docker_worker_smoke_test.py
      - name: Test API-to-worker integration
        run: python services/tests/docker_api_worker_integration_test.py


  kubernetes-manifests-validation:
    # Detailed validation documentation: docs/engineering_notes/kubernetes-manifest-validation.md
    name: Kubernetes manifests validation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: base
            path: k8s/manifests/base
          - target: on-premise
            path: k8s/manifests/overlays/on-premise

          
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      
      # External CR schemas and CRD exclusions are documented in the engineering note.
      - name: Install kubeconform
        run: |
          KUBECONFORM_VERSION=0.8.0
          curl -fsSLo "$RUNNER_TEMP/kubeconform.tar.gz" \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar -xzf "$RUNNER_TEMP/kubeconform.tar.gz" -C "$RUNNER_TEMP" kubeconform
          sudo install "$RUNNER_TEMP/kubeconform" /usr/local/bin/kubeconform
          kubeconform -v

      # Scan source resources individually; skip Kustomize-only files.
      - name: Scan individual ${{ matrix.target }} manifests
        run: |
          kubeconform \
            -summary \
            -output pretty \
            -skip CustomResourceDefinition \
            -ignore-filename-pattern '(?i)(^|[\\/])([^\\/]*patch[^\\/]*|kustomization\.yaml|[^\\/]*\.(json|sql))$' \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -strict \
            "${{ matrix.path }}"

      # Build catches Kustomize composition errors that schema scans cannot detect.
      - name: Build assembled ${{ matrix.target }} manifests
        run: |
          kubectl kustomize \
            "${{ matrix.path }}" \
            > "$RUNNER_TEMP/combined.yaml"
          
      # Validate the assembled output, including patches, generators, and transformations.
      - name: Scan combined ${{ matrix.target }} manifests
        run: |
          kubeconform \
            -summary \
            -output pretty \
            -skip CustomResourceDefinition \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -strict \
            "$RUNNER_TEMP/combined.yaml"


  # more kubernetes testing https://yrkan.com/blog/kubernetes-testing-strategies/


  kubernetes-local-deployment-test:
    name: Kubernetes local deployment test
    needs: [application-tests, kubernetes-manifests-validation]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Install kubeseal
        run: |
          KUBESEAL_VERSION=0.40.0
          curl -fsSLo "$RUNNER_TEMP/kubeseal.tar.gz" \
            "https://github.com/bitnami/sealed-secrets/releases/download/v${KUBESEAL_VERSION}/kubeseal-${KUBESEAL_VERSION}-linux-amd64.tar.gz"
          tar -xzf "$RUNNER_TEMP/kubeseal.tar.gz" -C "$RUNNER_TEMP" kubeseal
          sudo install -m 755 "$RUNNER_TEMP/kubeseal" /usr/local/bin/kubeseal
          kubeseal --version

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      # https://github.com/marketplace/actions/kind-cluster
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: app-test

      - name: Load service images
        uses: ./.github/actions/load-service-images
        with:
          artifact: ${{ env.SERVICE_IMAGES_ARTIFACT }}

      - name: Load images into kind
        run: |
          kind load docker-image \
            trading-api:dev \
            trading-worker:dev \
            trading-fetcher:dev \
            trading-redis-exporter:dev \
            --name app-test

      - name: Run bootstrapping script to deploy services to kind cluster
        run: python k8s/bootstrapping/bootstrap_kubernetes_resources.py --webhook-secret "dummyWebhookSecret" --redis-password "dummyRedisPassword" --postgres-password "dummyPostgresPassword" --non-interactive --overlay on-premise

      - name: Workload Controllers started test
        run: python k8s/tests/smoke_tests/workload_controllers_started/run.py
      - name: Passthrough smoke test
        run: python k8s/tests/smoke_tests/simple_passthrough/run.py
      # Add  more deployment and smoke-test steps here


