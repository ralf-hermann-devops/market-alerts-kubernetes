name: Application CI

on:
  push:
    # only run pipeline if changes are made to application code,
    # Kubernetes manifests, Docker Compose, or the pipeline itself
    paths:    
      - "services/**"
      - "k8s/**"
      - "Dockercompose.yaml"
      - ".github/workflows/application-ci.yml"

permissions:
  contents: read

env:
  SERVICE_IMAGES_ARTIFACT: service-images

jobs:
  application-lint:
    name: Application lint check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"
      - name: Install Ruff
        run: python -m pip install ruff
      - name: Lint Python code
        run: ruff check --isolated services   # running recommended default checks

  application-dependency-audit:
    name: Application dependency audit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, worker, fetcher]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"
      - name: Install audit tools and service dependencies
        run: python -m pip install pip-audit pipdeptree -r services/${{ matrix.service }}/requirements.txt
      - name: Show dependency tree
        run: pipdeptree --warn silence
      - name: Audit dependencies
        run: pip-audit -r services/${{ matrix.service }}/requirements.txt

  build-service-images:
    name: Build service images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build service images
        run: docker compose -f Dockercompose.yaml build --pull api worker fetcher
      - name: Save service images
        run: docker save -o "${{ env.SERVICE_IMAGES_ARTIFACT }}.tar" trading-api:dev trading-worker:dev trading-fetcher:dev
      - name: Upload service images
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SERVICE_IMAGES_ARTIFACT }}
          path: "${{ env.SERVICE_IMAGES_ARTIFACT }}.tar"
          compression-level: 0
          retention-days: 1

  image-scan:
    name: Image scan for vulnerabilities
    needs: build-service-images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, worker, fetcher]
    steps:
      - uses: actions/checkout@v4
      - name: Load service images
        uses: ./.github/actions/load-service-images
        with:
          artifact: ${{ env.SERVICE_IMAGES_ARTIFACT }}
      - name: Scan ${{ matrix.service }} image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: trading-${{ matrix.service }}:dev
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          # file doesnt take in account the actually installed and updated pip dependencies of the image
          skip-files: /usr/local/lib/python3.14/site-packages/pip/_vendor/bom.cdx.json  

  application-tests:
    name: Application tests
    needs: build-service-images
    runs-on: ubuntu-latest
    env:
      # tells tests not to rebuild images, but use the ones built in the previous step
      COMPOSE_NO_REBUILD_IN_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"
      - name: Install API test dependencies
        run: python -m pip install -r services/api/requirements.txt
      - name: Run API unit tests
        run: python -m pytest services/api/tests/test_testclient_api.py
      - name: Load service images
        uses: ./.github/actions/load-service-images
        with:
          artifact: ${{ env.SERVICE_IMAGES_ARTIFACT }}
      - name: Test worker processing
        run: python services/worker/tests/docker_worker_smoke_test.py
      - name: Test API-to-worker integration
        run: python services/tests/docker_api_worker_integration_test.py


  kubernetes-manifests-validation:
    name: Kubernetes manifests validation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Run a lint check on each kustomize overlay, the base and external infrastructure
      # base is checked independently of overlays, because overlays may not include 
      # all base manifests and base should be ok on its own without overlays
      # The external infrastructure overlay is checked in case manual changes are made to it
      matrix:
        include:
          - target: base
            path: k8s/base
            kustomize_args: ""
          - target: dev
            path: k8s/overlays/dev
            kustomize_args: ""
          # external infrastructure overlays are checked with --enable-helm for kustomize
          # due to keda getting installed with it.
          - target: infrastructure
            path: k8s/infrastructure
            kustomize_args: --enable-helm
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        if: matrix.target == 'infrastructure'
        with:
          version: v3.17.3
      
      # General note on kubeconform usage:
      # External CRs are validated using the additional scheme location's CRD catalog
      # on the additionally linked GitHub repository.
      # Additionally kubeconform needs -skip CustomResourceDefinition so it doesn't
      # try to check CRDs themselves which don't have a scheme available
      - name: Install kubeconform
        run: |
          KUBECONFORM_VERSION=0.8.0
          curl -fsSLo "$RUNNER_TEMP/kubeconform.tar.gz" \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar -xzf "$RUNNER_TEMP/kubeconform.tar.gz" -C "$RUNNER_TEMP" kubeconform
          sudo install "$RUNNER_TEMP/kubeconform" /usr/local/bin/kubeconform
          kubeconform -v

      - name: Scan individual ${{ matrix.target }} manifests
        # First scan all individual manifests in the target directory.
        # This reports schema problems in source manifests before transformations are applied.
        # This makes it easier to identify and fix issues across the target saves
        # the responsible developer time in fixing them all at once instead of one by one.
        run: |
          kubeconform \
            -summary \
            -output pretty \
            -skip CustomResourceDefinition \
            -ignore-filename-pattern '(^|[\\/])kustomization\.yaml$' \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            "${{ matrix.path }}"

      - name: Build assembled ${{ matrix.target }} manifests
        # This build catches composition errors that kubeconform's schema checks don't look for,
        # such as invalid resource references, patch targets, or Helm rendering failures.
        # It also produces the final output for kubeconform to validate below.
        run: |
          kubectl kustomize \
            "${{ matrix.path }}" \
            ${{ matrix.kustomize_args }} \
            > "$RUNNER_TEMP/combined.yaml"
          
      - name: Scan combined ${{ matrix.target }} manifests
        # kubeconform runs again, this time on the combined manifest
        # This explicitly checks what kustomize will actually produce including:
        # the effects of patches, generators, and transformations.
        run: |
          kubeconform \
            -summary \
            -output pretty \
            -skip CustomResourceDefinition \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            "$RUNNER_TEMP/combined.yaml"


  # more kubernetes testing https://yrkan.com/blog/kubernetes-testing-strategies/


  kubernetes-deployment-test:
    name: Kubernetes deployment test
    needs: [application-tests, kubernetes-manifests-validation]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      # https://github.com/marketplace/actions/kind-cluster
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: app-test

      - name: Load service images
        uses: ./.github/actions/load-service-images
        with:
          artifact: ${{ env.SERVICE_IMAGES_ARTIFACT }}

      - name: Load images into kind
        run: |
          kind load docker-image \
            trading-api:dev \
            trading-worker:dev \
            trading-fetcher:dev \
            --name app-test

      - name: Run bootstrapping script to deploy services to kind cluster
        run: python k8s/bootstrapping.py --webhook-secret "dummyWebhookSecret" --redis-password "dummyRedisPassword" --postgres-password "dummyPostgresPassword" --non-interactive --overlay dev

      # Add deployment and smoke-test steps here


