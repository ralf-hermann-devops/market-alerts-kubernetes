jobs:
  publish:
    name: Publish immutable images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # Setup Docker Buildx to build multi-platform images. This is required for caching and pushing to ECR.
      - uses: docker/setup-buildx-action@v3

      # More secure than secrets stored in GitHub. Github automatically generates 
      # a temporary token for the ECR login. AWS trusts the signature of GitHub
      # and wit that the info coming with it. Trust-rules in AWS IAM check the use
      # case for the token and approve it to assume a role that has permission to
      # push to ECR.
      # 1. GitHub generates adn send token to AWS -> AWS validates token based on trust rules
      # 2.  -> AWS returns temporary credentials ( access key ID, secret access key, and session token)
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.ECR_PUBLISH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # 3.  -> GitHub-ECR-login-action requests temporary ECR token from AWS and configures docker it
      - uses: aws-actions/amazon-ecr-login@v2   
        id: ecr-login 
        
      # 4.  -> Docker can now push to ECR with the temporary credentials
      - name: Build and publish API image
        uses: docker/build-push-action@v6
        with:
          context: services/api
          push: true
          tags: ${{ vars.ECR_API_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build and publish worker image
        uses: docker/build-push-action@v6
        with:
          context: services/worker
          push: true
          tags: ${{ vars.ECR_WORKER_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker
      - name: Build and publish fetcher image
        uses: docker/build-push-action@v6
        with:
          context: services/fetcher
          push: true
          tags: ${{ vars.ECR_FETCHER_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha,scope=fetcher
          cache-to: type=gha,mode=max,scope=fetcher
